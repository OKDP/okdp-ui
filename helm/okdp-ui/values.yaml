# -- Desired number of okdp-ui pods to run.
replicaCount: 1

image:
  # -- Docker image registry.
  repository: quay.io/okdp/okdp-ui
  # -- Image pull policy.
  pullPolicy: Always
  # -- Image tag.
  tag: 0.1.0-snapshot

# -- Secrets to be used for pulling images from private Docker registries.
imagePullSecrets: []
# -- Override for the `okdp-ui.fullname` template, maintains the release name.
nameOverride: ""
# -- Overrides the release name.
fullnameOverride: ""

# -- okdp-ui configuration. For more properties check: https://github.com/OKDP/okdp-ui/blob/main/public/config/app.config.json
ui:
  auth:
    # -- Authentication provider.
    provider: oauth2
    # -- For the list of the available options, check: https://manfredsteyer.github.io/angular-oauth2-oidc/docs/classes/AuthConfig.html
    oauth2:
      # -- Specify the oidc endpoint.
      issuer: http://oidc.local/realms/master
      # -- Specify the redirect uri. Should ends with: /index.html
      redirectUri: http://chart-example.local/index.html
      # -- Specify the redirect uri for silent refresh. Should ends with: /silent-refresh.html
      silentRefreshRedirectUri: http://chart-example.local/silent-refresh.html
      # -- Specify your OIDC client Id. The clientId should be public.
      clientId: ""
      # -- Specify the responseType.
      responseType: code
      # -- Specify the scopes as space separated values
      # Example: "openid profile email roles"
      scope: openid profile email offline_access roles
      showDebugInformation: true
      requireHttps: false
  # okdp-api configuration.
  okdpApi:
    # -- okdp-api rest endpoint.
    apiUrl: http://okdp-api.local/api/v1
    # -- okdp-api swagger endpoint.
    swaggerUrl: http://okdp-api-swagger.local
  # KAD catalogs.
  catalogs:
    # -- kad catalog services to dispaly in the sidebar menu ui.
    services:
    - all
    # -- kad catalog services to dispaly in the catalog page.
    kad:
    - all

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Additional annotations for the okdp-ui pod.
podAnnotations: {}
# -- Additional labels for the okdp-ui pod.
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

# -- Security context for the container.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 4200

# Ingress configuration for external access.
ingress:
  enabled: false
  # -- Specify the ingress class (Kubernetes >= 1.18).
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe for the okdp-ui container.
livenessProbe:
  httpGet:
    path: /
    port: http
# -- Readiness probe for the okdp-ui container.
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity for pod scheduling.
affinity: {}
