<div class="position-relative">
  <ul class="navbar-nav">
    <li class="nav-item">
      <div class="input-group form-field-underline">
        <span class="input-group-text search-icon">
          <i class="material-symbols-outlined">search</i>
        </span>
        <input
          type="text"
          class="form-control border-0 rounded-0"
          placeholder="Search..."
          aria-label="Search"
          [(ngModel)]="searchFilter"
          (input)="onSearchChange()" />
        <span class="input-group-text close-icon" (click)="onReset()">
          <i class="fas fa-times rounded-circle"></i>
        </span>
        <span class="input-group-text refresh-icon">
          <i class="material-symbols-outlined text-okdp">refresh</i>
        </span>
      </div>
    </li>
  </ul>
</div>
<div *ngIf="!found" class="container-fluid mx-0 px-0 pt-4">
  <div class="row row-cols-1 row-cols-md-4 g-2">
    <div class="col">
      <div class="card h-100 rounded-3 shadow-sm mx-auto mx-1 position-relative">
        <div class="card-body">
          <button
            type="button"
            class="position-absolute close-icon top-0 end-0 m-2 border-0 bg-transparent p-0"
            aria-label="Close"
            (click)="onReset()">
            <i class="material-symbols-outlined">close</i>
          </button>
          <div class="card-body d-flex align-items-center p-2 gap-2">
            <i class="material-symbols-outlined rotate-icon">search_off</i>
            <p class="card-text">{{ noItemsLabel }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
