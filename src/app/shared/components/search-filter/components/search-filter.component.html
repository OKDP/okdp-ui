<div class="position-relative">
  <div class="input-group form-field-underline">
    <span class="input-group-text search-icon">
      <i class="material-symbols-outlined">search</i>
    </span>
    <input
      type="text"
      class="form-control lh-1 border-top-bg-primary rounded-0"
      placeholder="Filter..."
      aria-label="Filter"
      [(ngModel)]="searchFilter"
      (input)="onSearchChange()" />
    <span class="input-group-text close-icon" (click)="onReset()">
      <i class="fas fa-times rounded-circle"></i>
    </span>
    <span class="input-group-text refresh-icon">
      <i class="material-symbols-outlined text-okdp">refresh</i>
    </span>
  </div>
</div>
