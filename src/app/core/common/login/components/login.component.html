<div class="d-flex flex-column min-vh-100">
  <!-- Header -->
  <div class="container-fluid">
    <ul class="navbar-nav ms-auto d-flex flex-row align-items-center justify-content-end">
      <!-- Documentation -->
      <li class="nav-item px-5">
        <a class="nav-link text-primary" href="https://okdp.io" target="_blank"> Documentation </a>
      </li>
      <!-- Github -->
      <li class="nav-item me-3">
        <a class="nav-link" href="https://github.com/okdp" target="_blank">
          <i class="fa-brands fa-github text-primary"></i>
        </a>
      </li>
    </ul>
  </div>
  <!-- Main -->
  <main class="d-flex flex-grow-1 justify-content-center align-items-center">
    <div class="card p-4 shadow-sm" style="width: 350px">
      <div class="text-center">
        <img src="/images/okdp-inverted.png" alt="okdp Logo" class="mb-1" style="height: 120px" />
      </div>
      <div class="text-center mt-3">
        <span class="text-primary">A free, open-source, and cloud-native data platform designed for Kubernetes. </span>
      </div>

      <hr class="my-4" />

      <div class="d-flex justify-content-center align-items-center my-4">
        <button class="btn text-primary" (click)="login()">
          <i class="fas fa-sign-in-alt"></i>
          <span class="ps-3">Login with Keycloak</span>
        </button>
      </div>

      <div class="text-center text-primary pt-3">
        <a class="text-decoration-none text-primary" href="https://github.com/okdp" target="_blank">Need help?</a>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <div class="text-primary py-3"></div>
</div>
