<!-- Overlay -->
<div *ngIf="isToggled" class="offcanvas-backdrop fade {{ isToggled ? 'show' : '' }}" (click)="hideSidebar()"></div>
<div class="container-fluid">
  <!-- User profile right sidebar -->
  <div
    tabindex="-1"
    class="offcanvas offcanvas-end notifications show {{
      isToggled ? 'slide-in' : 'slide-out'
    }}">
    <div class="offcanvas-header pb-0">
      <div class="d-flex gap-2">
        <div class="d-flex align-items-center flex-shrink-0">
          <i class="fas fa-bell fa-2x okdp-text-primary"></i>
        </div>
        <div class="d-flex align-items-center text-primary flex-grow-1">Notifications</div>
      </div>
      <button
        type="button"
        class="close-icon position-absolute top-0 end-0 m-2 border-0 bg-transparent p-0"
        aria-label="Close"
        (click)="hideSidebar()">
        <i class="material-symbols-outlined">close</i>
      </button>
    </div>
    <div class="offcanvas-body">
      <hr />
      <div class="container mx-0 px-0 pt-2">
        <div class="row row-cols-1 row-cols-md-1">
          <div *ngFor="let notification of notifications" class="col">
            <div class="card rounded-3 shadow-sm mx-auto mx-1 position-relative">
              <button
                type="button"
                class="close-icon position-absolute top-0 end-0 border-0 bg-transparent p-0 icon-05x"
                aria-label="Close"
                (click)="onClose(notification.service)">
                <i class="material-symbols-outlined">close</i>
              </button>
              <div class="card-body border-1">
                <div class="d-flex gap-2">
                  <div class="d-flex align-items-center flex-shrink-0">
                    <i
                      class="material-symbols-outlined me-2"
                      [class]="getClass(notification.type).msg"
                      >{{ getClass(notification.type).icon }}</i
                    >
                  </div>
                  <div class="d-flex flex-column flex-grow-1">
                    <p class="card-text">
                      <span class="text-primary">{{ notification.service }}</span>
                      {{ notification.message }}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li *ngIf="notifications.length === 0" class="nav-item text-primary">No notifications to display !</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
