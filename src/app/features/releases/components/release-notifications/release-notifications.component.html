<div *ngIf="!isLoaded" class="loading-overlay">
  <app-loading />
</div>
<div *ngIf="isLoaded" class="container-fluid px-0 mb-4">
  <div *ngIf="notifications.length > 0; else noNotifications" class="mt-3">
    <div class="row row-cols-1 row-cols-md-1">
      <div *ngFor="let notification of notifications" class="col">
        <div class="card rounded-3 shadow-sm mx-auto mx-1 position-relative">
          <div class="card-body border-1">
            <div class="d-flex gap-2">
              <div class="d-flex align-items-center flex-shrink-0">
                <i class="material-symbols-outlined me-2" [class]="getClass(notification.type).msg">
                  {{ getClass(notification.type).icon }}
                </i>
              </div>
              <div class="d-flex flex-column flex-grow-1">
                <p class="card-text">
                  <span class="text-primary">{{ notification.service }}</span>
                  {{ notification.message }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ng-template #noNotifications>
    <div class="alert alert-info mt-3">
      <span class="d-flex align-items-center">
        <i class="material-symbols-outlined text-okdp"> info </i>
        <span class="ms-2">No notifications to display.</span>
      </span>
    </div>
  </ng-template>
</div>
