<app-dialog
  *ngIf="showDialog"
  [title]="'Delete Projects'"
  [items]="[selectedProject]"
  [message]="'Are you sure you want to delete the following projects: '"
  [btnConfirmLabel]="'Delete'"
  (confirmed)="onConfirmDelete()"
  (cancelled)="onCancelDelete()" />

<div *ngIf="!isLoaded" class="loading-overlay">
  <app-loading />
</div>

<div *ngIf="isLoaded" class="d-flex flex-column flex-grow-1 h-100">
  <mat-table class="mat-elevation-z8 px-3" matSort [dataSource]="dataSource">
    <mat-header-row *matHeaderRowDef="displayedColumns" />
    <mat-row
      *matRowDef="let row; columns: displayedColumns"
      [class.bg-okdp]="isCurrentProject(row)"
      (mouseenter)="hoveredRow = row"
      (mouseleave)="hoveredRow = null" />

    <ng-container matColumnDef="select">
      <mat-header-cell *matHeaderCellDef class="select-column">
        <mat-checkbox
          [checked]="isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
          (change)="toggleDeleteAll()" />
      </mat-header-cell>
      <mat-cell *matCellDef="let row" class="select-column">
        <mat-checkbox
          [checked]="selection.isSelected(row)"
          [disabled]="row.name === 'default'"
          (click)="$event.stopPropagation()"
          (change)="toggleDelete(row)" />
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="name" class="px-0">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Name </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <img src="images/okdp-notext.svg" class="table-cell-icon me-3" />
        {{ row.name }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="displayName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Display Name </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.displayName }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="environment">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Environment </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.environment }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="creationTimestamp">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Creation Date </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.creationTimestamp | date: 'yyyy-MM-dd HH:mm:ss' : '+0200' }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Status </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <i
          class="material-symbols-outlined border-0 fw-bold me-1"
          [ngClass]="'text-' + row.statusLabel"
          >{{ row.statusIcon }}</i
        >
        {{ row.status }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef />
      <mat-cell *matCellDef="let row" class="position-relative">
        <div
          *ngIf="hoveredRow === row"
          class="position-absolute top-50 end-0 translate-middle-y pe-2 bg-transparent opacity-90 d-flex justify-content-center gap-3">
          <ul class="navbar-nav d-flex flex-row w-100 gap-2 me-3">
            <li class="nav-item me-5">
              <i
                role="button"
                class="material-symbols-outlined text-okdp-primary cursor-pointer"
                matTooltip="Add to favorites"
                (click)="onFavorite(row)"
                >favorite</i
              >
            </li>
            <li class="nav-item">
              <i
                *ngIf="!isCurrentProject(row)"
                role="button"
                class="material-symbols-outlined text-okdp-primary cursor-pointer"
                matTooltip="Switch Project"
                (click)="onSwitch(row)"
                >swap_horiz</i
              >
            </li>
            <li class="nav-item">
              <i
                role="button"
                class="material-symbols-outlined text-okdp-primary cursor-pointer"
                matTooltip="Edit"
                (click)="onEdit(row)"
                >edit</i
              >
            </li>
            <li class="nav-item">
              <i
                *ngIf="row.name !== 'default'"
                role="button"
                class="material-symbols-outlined text-okdp-primary cursor-pointer"
                matTooltip="Delete"
                (click)="onDelete(row)"
                >delete</i
              >
            </li>
          </ul>
        </div>
      </mat-cell>
    </ng-container>
  </mat-table>

  <div class="d-flex justify-content-end table-footer">
    <mat-paginator showFirstLastButtons [pageSize]="10" [pageSizeOptions]="[10, 20, 50, 100]" />
  </div>
</div>
