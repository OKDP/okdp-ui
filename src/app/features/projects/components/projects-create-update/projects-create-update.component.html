<div class="container mx-0 px-0 pt-4 position-relative">
  <div *ngIf="!isLoaded || isSubmitting" class="loading-overlay">
    <app-loading />
  </div>
  <div class="row row-cols-1 row-cols-md-1">
    <div class="col">
      <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
        <div class="card rounded-3 shadow-sm mx-auto mx-1 border-0">
          <div class="card-header d-flex align-items-center justify-content-start p-2 position-relative">
            <ul class="nav w-100 d-flex flex-row justify-content-start align-items-center gap-1">
              <li class="nav-item d-flex align-items-center">
                <span
                  class="card-title"
                  >{{ isCreate ? 'Create New Project' : 'Update Project' + ' - ' + projectName }}</span
                >
              </li>
            </ul>
          </div>

          <div class="card-body">
            <div class="row align-items-center justify-content-start gap-5">
              <!-- Name -->
              <div class="col">
                <div class="form-group">
                  <label for="name">Name</label>
                  <input
                    id="name"
                    class="form-control form-field-underline border-bottom-primary px-0"
                    formControlName="name"
                    required
                    [readonly]="!isCreate"
                    [ngClass]="{'form-field-required-underline': !isFieldValid('name')}" />
                  <small class="form-text text-muted">Project Name.</small>
                </div>
              </div>
              <!-- Display Name -->
              <div class="col">
                <div class="form-group">
                  <label for="displayName">Display name</label>
                  <input
                    id="displayName"
                    class="form-control form-field-underline border-bottom-primary px-0"
                    formControlName="displayName"
                    aria-label="Enter display name"
                    required
                    [ngClass]="{'form-field-required-underline': !isFieldValid('displayName')}" />
                  <small class="form-text text-muted">Friendly name (can include spaces and capital letters).</small>
                </div>
              </div>
              <div class="col d-flex justify-content-end">
                <div class="d-flex gap-2"></div>
              </div>
            </div>
            <div class="row align-items-center justify-content-start gap-5 mt-3">
              <!-- Environment -->
              <div class="col">
                <div class="form-group">
                  <label for="environment">Environment</label>
                  <input
                    id="environment"
                    class="form-control form-field-underline border-bottom-primary px-0"
                    formControlName="environment"
                    aria-label="Enter environment"
                    required
                    [ngClass]="{'form-field-required-underline': !isFieldValid('environment')}" />
                  <small class="form-text text-muted"
                    >Target environment, e.g. <code class="text-okdp-color">dev</code>,
                    <code class="text-okdp-color">test</code>, or <code class="text-okdp-color">prod</code>.</small
                  >
                </div>
              </div>
              <!-- Description -->
              <div class="col">
                <div class="form-group">
                  <label for="description">Description</label>
                  <input
                    id="description"
                    class="form-control form-field-underline border-bottom-primary px-0"
                    formControlName="description"
                    aria-label="Enter description"
                    required
                    [ngClass]="{'form-field-required-underline': !isFieldValid('description')}" />
                  <small class="form-text text-muted">Project description.</small>
                </div>
              </div>
              <!-- Submit -->
              <div class="col d-flex justify-content-end">
                <div class="d-flex gap-2">
                  <button type="button" class="btn text-primary px-3 py-1" (click)="goBack()">Cancel</button>
                  <button type="submit" class="btn text-okdp-primary px-3 py-1" [disabled]="isSubmitting || !isValid">
                    {{ isCreate ? 'Create' : 'Update' }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
